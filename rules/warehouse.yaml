# DRAFT — warehouse case study: task assignment by repeated leader election
# (Audrito et al., ISoLA 2026, Alg. 1) plus ATC-style route reservation.
#
# Format: the abusim/abumon scenario format, extended so that one rule holds
# several tasks (`tasks:`; condtype 0 = `for`, local; 1 = `for all`, remote).
# The rule grammar already allows this (prule: RULE name ON events task+);
# the YAML loader does not yet (step 4). A `for all` task never reaches the
# node that sent it.
#
# Nodes: robot1..3 (vehicles.Nav2Robot) and one dispatcher (basic node).
# Built-in robot attributes (rosresources.Nav2RobotResources), not declared here:
#   inputs  pose_x, pose_y, pose_yaw, nav_status, battery, fault, round
#   outputs goal_x, goal_y, goal_yaw, goal_seq, cancel_seq
# Builtins: ZoneOf(x, y), ZoneRoute(x0, y0, x1, y1) (zone bitmasks, package zones).
#
# Layers, bottom-up (each rule set below):
#   traffic   — move(dest): reserve a route, drive, release. The only layer
#               that sends goals. Upper layers just set dest_x/dest_y and
#               increment move_req, and watch `arrivals`.
#   task      — per robot: phases of the task it executes (to_from, loading,
#               to_to, unloading), going home, yielding, crashing.
#   slot_1    — per task slot k (slot 1 shown; slots 2..K are the same rules
#               with t1_ -> tK_ and 1 -> K): cost, election, take-over.
#   dispatch  — dispatcher node: puts a new task in a free slot, broadcasts it.
#
# Rounds: `round` = floor(sim time / 1 s), the same on every robot.

nodes:
  - id: robot1
    type: nav2robot
    ruleSets: [traffic, task, slot_1, slot_2, slot_3]
    memory: &robot
      agentId: 1
      is_robot: true
      home_x: -5.5          # parking spot = spawn pose (config/robots.yaml)
      home_y: -6.5
      # --- parameters ---
      THETA: 3              # rounds as best bidder before taking a task
      DWELL: 3              # rounds to load / unload a crate
      N_ROBOTS: 3           # a route is granted after N_ROBOTS-1 answers, all go
      RETRY: 5              # rounds before a denied robot asks again anyway
      K_AHEAD: 3            # window: the zone I am in + K_AHEAD-1 zones ahead
      REROUTE: 4            # rounds stopped and refused before planning a detour
      REQ_TIMEOUT: 3        # rounds a request may wait for its answers before it is resent
      HYST: 0.8             # cost factor for the robot already on the task (omega)
      COST_INF: 1.0e9       # crashed, or busy on another task
      COST_CARRY: -1.0e9    # carrying the task's crate: never pre-empted
      # --- task layer ---
      state: "idle"         # idle | busy | crashed
      busy_task: 0          # slot of the task being executed, 0 = none
      phase: "none"         # none | to_from | loading | to_to | unloading
      cur_fx: 0.0           # copy of the task being executed (L_from, L_to)
      cur_fy: 0.0
      cur_tx: 0.0
      cur_ty: 0.0
      dwell_end: 0
      finished: 0           # slot just completed (triggers its termination)
      # --- traffic layer ---
      dest_x: 0.0
      dest_y: 0.0
      move_req: 0           # increment to move to (dest_x, dest_y)
      req_id: 0             # id of my latest route request
      req_open: false
      req_mask: 0           # zones of the open request (a window)
      req_x: 0.0            # where the request was made (the window starts there)
      req_round: 0          # round the request was made
      req_y: 0.0
      req_ts: 0             # its Lamport timestamp
      lclock: 0             # Lamport clock of route requests
      resp: 0               # answers received for the open request
      denied: false         # one of them was no-go
      waiting: false        # denied, will ask again
      wait_round: 0
      route: 0              # zones reserved while moving: the current window
      stopped: false        # at the window end, waiting for the next window
      final: false          # dest is inside the window
      avoid: 0              # zones the path must avoid (after a reroute)
      block: 0              # zones held by the robots that said no-go
      cur_zone: 0           # bit of the zone I am in (ZoneOf(pose))
      held: 0               # zones I hold: route, plus my zone while dwelling
      moving: false
      arrivals: 0           # incremented on each arrival at dest
      wake: 0               # incremented by others when they release zones
      q_from: 0             # last route request received: who, which, when, what
      q_id: 0
      q_ts: 0
      q_mask: 0
      # --- task slots (slot 1 shown; same for 2..K) ---
      t1_active: false
      t1_fx: 0.0
      t1_fy: 0.0
      t1_tx: 0.0
      t1_ty: 0.0
      t1_cost: 0.0
      t1_bcost: 0.0
      t1_bid: 0
      t1_bround: 0
      t1_lead: 0
      t1_streak: 0

  - id: robot2
    type: nav2robot
    ruleSets: [traffic, task, slot_1, slot_2, slot_3]
    memory:
      <<: *robot
      agentId: 2
      home_x: -5.5
      home_y: -7.5

  - id: robot3
    type: nav2robot
    ruleSets: [traffic, task, slot_1, slot_2, slot_3]
    memory:
      <<: *robot
      agentId: 3
      home_x: -5.5
      home_y: -8.5

  - id: dispatcher
    type: basic
    ruleSets: [dispatch]
    memory:
      agentId: 0
      is_robot: false
      # a new task is written here from outside (Input), then pending = true
      new_fx: 0.0
      new_fy: 0.0
      new_tx: 0.0
      new_ty: 0.0
      pending: false
      t1_active: false      # mirrors the robots' slots (cleared by Terminate)
      t2_active: false
      t3_active: false

ruleSets:
  # ===========================================================================
  # Traffic: move(dest) with a moving window of reserved zones.
  #
  # A robot holds the zone it is in plus the next K_AHEAD-1 zones of its zone
  # path to dest (the window), and drives to the end of the window: Nav2's
  # goal is dest if dest is in the window, else just inside the window's exit
  # door (builtins ZoneWindow, ZoneGoalX/Y). On entering a zone it releases
  # the zones behind and asks for the next window; if that is granted before
  # it reaches the window end it keeps driving, otherwise it stops there and
  # waits, holding only the zone it is in.
  #
  #   move_req++ -> Request: broadcast the window (all-or-nothing)
  #   every other robot answers go or no-go (Respond): no-go if the window
  #   overlaps zones it holds, or its own open request when that request has
  #   priority (Lamport timestamp, then lower agentId); a no-go carries the
  #   zones the denier holds (block)
  #   all N_ROBOTS-1 answers go -> Grant: hold the window, drive to its end
  #   a no-go -> Denied: wait for a wake (someone released zones) or RETRY
  #   rounds; a robot stopped at its window end for REROUTE rounds plans a
  #   detour avoiding the zones that blocked it (avoid)
  #
  # Head-on: two robots stopped in adjacent zones, each needing the other's,
  # never get a go; the reroute moves one of them round the other. A stopped
  # robot holds only its own zone, so nothing else can be circular.
  #
  # Idle robots hold no zones (parked obstacles; three robots parked in W1
  # would otherwise deny each other forever).
  # ===========================================================================
  - id: traffic
    rules:
      # One request at a time: two triggers firing together (e.g. Extend and
      # WindowEnd) would otherwise bump req_id twice while both broadcasts
      # carry the first id, and every answer would be discarded. Lazy mode
      # re-checks !req_open when the local half is applied, so the second
      # firing is dropped; its broadcast is identical and draws no answers.
      - name: "Request"
        event: "move_req"
        tasks:
          # A detour that cannot reach dest: forget it and ask again.
          - condtype: 0
            condition: "state != \"crashed\" && !req_open && ZoneWindow(pose_x, pose_y, dest_x, dest_y, K_AHEAD, avoid) == 0 && avoid != 0"
            action: "avoid = 0, move_req = move_req + 1"
          - condtype: 0
            condition: "state != \"crashed\" && !req_open && ZoneWindow(pose_x, pose_y, dest_x, dest_y, K_AHEAD, avoid) != 0"
            action: "req_mask = ZoneWindow(pose_x, pose_y, dest_x, dest_y, K_AHEAD, avoid), req_x = pose_x, req_y = pose_y, req_round = round, req_id = req_id + 1, req_ts = lclock + 1, lclock = lclock + 1, req_open = true, resp = 0, denied = false, waiting = false, block = 0"
          - condtype: 1
            condition: "state != \"crashed\" && !req_open && ZoneWindow(pose_x, pose_y, dest_x, dest_y, K_AHEAD, avoid) != 0 && ext.is_robot"
            action: "ext.q_from = agentId, ext.q_id = req_id + 1, ext.q_ts = lclock + 1, ext.q_mask = ZoneWindow(pose_x, pose_y, dest_x, dest_y, K_AHEAD, avoid)"

      # Lamport clock: a received request moves my clock past its timestamp.
      - name: "Clock"
        event: "q_ts"
        tasks:
          - condtype: 0
            condition: "q_ts > lclock"
            action: "lclock = q_ts"

      # Runs on each robot that received a request; ext = the requester.
      # Triggered by the whole (q_from, q_id, q_ts) triple: request ids are
      # per sender, so two robots' requests can carry the same q_id.
      - name: "Respond"
        event: "q_from q_id q_ts"
        tasks:
          - condtype: 1
            condition: "ext.agentId == q_from && ext.req_id == q_id && ext.req_open && ((q_mask & held) != 0 || (req_open && (q_mask & req_mask) != 0 && (req_ts < q_ts || (req_ts == q_ts && agentId < q_from))))"
            action: "ext.denied = true, ext.resp = ext.resp + 1, ext.block = ext.block | held"
          - condtype: 1
            condition: "ext.agentId == q_from && ext.req_id == q_id && ext.req_open && (q_mask & held) == 0 && !(req_open && (q_mask & req_mask) != 0 && (req_ts < q_ts || (req_ts == q_ts && agentId < q_from)))"
            action: "ext.resp = ext.resp + 1"

      # All go: hold the window and drive to its end (computed from where the
      # request was made, so the goal matches the zones granted).
      - name: "Grant"
        event: "resp"
        tasks:
          - condtype: 0
            condition: "req_open && !denied && state != \"crashed\" && resp >= N_ROBOTS - 1"
            action: "route = req_mask, req_open = false, moving = true, stopped = false, final = (req_mask & ZoneOf(dest_x, dest_y)) != 0, goal_x = ZoneGoalX(req_x, req_y, dest_x, dest_y, K_AHEAD, avoid), goal_y = ZoneGoalY(req_x, req_y, dest_x, dest_y, K_AHEAD, avoid), goal_yaw = 0.0, goal_seq = goal_seq + 1"

      - name: "Denied"
        event: "denied"
        tasks:
          - condtype: 0
            condition: "denied && req_open"
            action: "req_open = false, waiting = true, wait_round = round"

      # Safety net: a request still missing answers after REQ_TIMEOUT rounds
      # (an answer lost, or quoting an outdated id) is withdrawn and resent.
      - name: "RequestTimeout"
        event: "round"
        tasks:
          - condtype: 0
            condition: "req_open && state != \"crashed\" && round >= req_round + REQ_TIMEOUT"
            action: "req_open = false, move_req = move_req + 1"

      # Two rules because a rule cannot tell which of its events fired:
      # someone released zones (wake changed), or RETRY rounds went by.
      - name: "RetryOnWake"
        event: "wake"
        tasks:
          - condtype: 0
            condition: "waiting && state != \"crashed\""
            action: "waiting = false, move_req = move_req + 1"

      - name: "RetryTimeout"
        event: "round"
        tasks:
          - condtype: 0
            condition: "waiting && state != \"crashed\" && round >= wait_round + RETRY"
            action: "waiting = false, move_req = move_req + 1"

      # Stopped at the window end and refused for REROUTE rounds: plan round
      # the zones held by whoever said no-go (my own zone excepted).
      - name: "Reroute"
        event: "round"
        tasks:
          - condtype: 0
            condition: "waiting && stopped && state != \"crashed\" && block != 0 && round >= wait_round + REROUTE && (block - (block & cur_zone)) != avoid"
            action: "avoid = block - (block & cur_zone), waiting = false, move_req = move_req + 1"

      # nav_done (from the robot) is the goal_seq of the latest goal that
      # reached a final state; nav_done == goal_seq means it was my current
      # goal, however briefly it was active.

      # Reached dest: the move is over.
      - name: "Arrived"
        event: "nav_done nav_status"
        tasks:
          - condtype: 0
            condition: "moving && nav_done == goal_seq && final && nav_status == \"succeeded\""
            action: "moving = false, stopped = false, route = 0, avoid = 0, arrivals = arrivals + 1"
          - condtype: 1
            condition: "moving && nav_done == goal_seq && final && nav_status == \"succeeded\" && ext.is_robot"
            action: "ext.wake = ext.wake + 1"

      # Reached the end of the window before the next one was granted: wait
      # there (asking for it if no request is pending).
      - name: "WindowEnd"
        event: "nav_done nav_status"
        tasks:
          - condtype: 0
            condition: "moving && nav_done == goal_seq && !final && nav_status == \"succeeded\""
            action: "stopped = true"
          - condtype: 0
            condition: "moving && nav_done == goal_seq && !final && nav_status == \"succeeded\" && !req_open && !waiting"
            action: "move_req = move_req + 1"

      - name: "NavFailed"
        event: "nav_done nav_status"
        tasks:
          - condtype: 0
            condition: "moving && nav_done == goal_seq && (nav_status == \"failed\" || nav_status == \"canceled\")"
            action: "moving = false, stopped = false, route = route & cur_zone, move_req = move_req + 1"
          - condtype: 1
            condition: "moving && nav_done == goal_seq && (nav_status == \"failed\" || nav_status == \"canceled\") && ext.is_robot"
            action: "ext.wake = ext.wake + 1"

      - name: "Held"
        event: "route phase pose_x pose_y"
        tasks:
          - condtype: 0
            condition: "phase == \"loading\" || phase == \"unloading\""
            action: "held = route | ZoneOf(pose_x, pose_y)"
          - condtype: 0
            condition: "phase != \"loading\" && phase != \"unloading\""
            action: "held = route"

      # The zone the robot is in, as an event.
      - name: "Zone"
        event: "pose_x pose_y"
        tasks:
          - condtype: 0
            condition: "true"
            action: "cur_zone = ZoneOf(pose_x, pose_y)"

      # On entering a zone: release the zones behind (keep those still on the
      # path to dest, and the one I am in) and wake the others.
      - name: "ReleaseBehind"
        event: "cur_zone"
        tasks:
          - condtype: 0
            condition: "moving && ((route & ZoneWindow(pose_x, pose_y, dest_x, dest_y, 99, avoid)) | (route & cur_zone)) != route"
            action: "route = (route & ZoneWindow(pose_x, pose_y, dest_x, dest_y, 99, avoid)) | (route & cur_zone)"
          - condtype: 1
            condition: "moving && ((route & ZoneWindow(pose_x, pose_y, dest_x, dest_y, 99, avoid)) | (route & cur_zone)) != route && ext.is_robot"
            action: "ext.wake = ext.wake + 1"

      # On entering a zone: ask for the next window if I do not hold it yet.
      - name: "Extend"
        event: "cur_zone"
        tasks:
          - condtype: 0
            condition: "moving && !final && !req_open && !waiting && (ZoneWindow(pose_x, pose_y, dest_x, dest_y, K_AHEAD, avoid) & route) != ZoneWindow(pose_x, pose_y, dest_x, dest_y, K_AHEAD, avoid)"
            action: "move_req = move_req + 1"

  # ===========================================================================
  # Task: what the robot does with the task it was assigned (busy_task).
  # Phase changes are driven by `arrivals` (traffic layer) and dwell timers.
  # ===========================================================================
  - id: task
    rules:
      - name: "ArrivedFrom"
        event: "arrivals"
        tasks:
          - condtype: 0
            condition: "state == \"busy\" && phase == \"to_from\""
            action: "phase = \"loading\", dwell_end = round + DWELL"

      - name: "Loaded"
        event: "round"
        tasks:
          - condtype: 0
            condition: "state == \"busy\" && phase == \"loading\" && round >= dwell_end"
            action: "phase = \"to_to\", dest_x = cur_tx, dest_y = cur_ty, move_req = move_req + 1"

      - name: "ArrivedTo"
        event: "arrivals"
        tasks:
          - condtype: 0
            condition: "state == \"busy\" && phase == \"to_to\""
            action: "phase = \"unloading\", dwell_end = round + DWELL"

      # Task complete: free the robot, terminate the slot (rule Terminate*),
      # go home.
      - name: "Unloaded"
        event: "round"
        tasks:
          - condtype: 0
            condition: "state == \"busy\" && phase == \"unloading\" && round >= dwell_end"
            action: "finished = busy_task, state = \"idle\", busy_task = 0, phase = \"none\", dest_x = home_x, dest_y = home_y, move_req = move_req + 1"

      # Crash (injected on /robotN/fault): stop, release everything. The
      # robot keeps communicating with cost COST_INF, so the election hands
      # its task to someone else. If it was carrying the crate, the new
      # robot starts again from L_from (first version).
      - name: "Crash"
        event: "fault"
        tasks:
          - condtype: 0
            condition: "fault && state != \"crashed\""
            action: "state = \"crashed\", busy_task = 0, phase = \"none\", cancel_seq = cancel_seq + 1, moving = false, stopped = false, route = 0, avoid = 0, req_open = false, waiting = false"
          - condtype: 1
            condition: "fault && state != \"crashed\" && ext.is_robot"
            action: "ext.wake = ext.wake + 1"

  # ===========================================================================
  # Slot 1 (one per task slot): cost, election, take-over, yield, termination.
  # Election as in the earlier draft: every round each live robot broadcasts
  # its cost; receivers keep the round's minimum (ties -> lower agentId); the
  # first bid of a new round closes the previous round into t1_lead.
  # Cost (paper): omega * dist(pose, L_from) / charge, -inf once the crate is
  # on board, +inf when busy elsewhere.
  # ===========================================================================
  - id: slot_1
    rules:
      - name: "Cost1"
        event: "round pose_x pose_y state phase battery"
        tasks:
          - condtype: 0
            condition: "t1_active && state == \"idle\""
            action: "t1_cost = Sqrt((pose_x - t1_fx) * (pose_x - t1_fx) + (pose_y - t1_fy) * (pose_y - t1_fy)) / (0.05 + battery / 100.0)"
          - condtype: 0
            condition: "t1_active && state == \"busy\" && busy_task == 1 && (phase == \"to_from\" || phase == \"loading\")"
            action: "t1_cost = HYST * Sqrt((pose_x - t1_fx) * (pose_x - t1_fx) + (pose_y - t1_fy) * (pose_y - t1_fy)) / (0.05 + battery / 100.0)"
          - condtype: 0
            condition: "t1_active && state == \"busy\" && busy_task == 1 && (phase == \"to_to\" || phase == \"unloading\")"
            action: "t1_cost = COST_CARRY"
          - condtype: 0
            condition: "t1_active && (state == \"crashed\" || (state == \"busy\" && busy_task != 1))"
            action: "t1_cost = COST_INF"

      - name: "Elect1"
        event: "round"
        tasks:
          - condtype: 0
            condition: "t1_active && state != \"crashed\" && t1_bround < round"
            action: "t1_lead = t1_bid, t1_bround = round, t1_bcost = t1_cost, t1_bid = agentId"
          - condtype: 0
            condition: "t1_active && state != \"crashed\" && t1_bround == round && (t1_cost < t1_bcost || (t1_cost == t1_bcost && agentId < t1_bid))"
            action: "t1_bcost = t1_cost, t1_bid = agentId"
          - condtype: 1
            condition: "t1_active && state != \"crashed\" && ext.is_robot && ext.t1_active && ext.t1_bround < round"
            action: "ext.t1_lead = ext.t1_bid, ext.t1_bround = round, ext.t1_bcost = t1_cost, ext.t1_bid = agentId"
          - condtype: 1
            condition: "t1_active && state != \"crashed\" && ext.is_robot && ext.t1_active && ext.t1_bround == round && (t1_cost < ext.t1_bcost || (t1_cost == ext.t1_bcost && agentId < ext.t1_bid))"
            action: "ext.t1_bcost = t1_cost, ext.t1_bid = agentId"

      - name: "Streak1"
        event: "t1_bround"
        tasks:
          - condtype: 0
            condition: "t1_lead == agentId"
            action: "t1_streak = t1_streak + 1"
          - condtype: 0
            condition: "t1_lead != agentId"
            action: "t1_streak = 0"

      - name: "Take1"
        event: "t1_streak"
        tasks:
          - condtype: 0
            condition: "t1_active && state == \"idle\" && t1_streak >= THETA"
            action: "state = \"busy\", busy_task = 1, phase = \"to_from\", cur_fx = t1_fx, cur_fy = t1_fy, cur_tx = t1_tx, cur_ty = t1_ty, dest_x = t1_fx, dest_y = t1_fy, move_req = move_req + 1"

      # A better robot appeared before pick-up: give the task up, go home.
      # (After pick-up the cost is COST_CARRY, so this cannot happen.)
      - name: "Yield1"
        event: "t1_lead"
        tasks:
          - condtype: 0
            condition: "state == \"busy\" && busy_task == 1 && t1_lead != agentId && t1_lead != 0 && (phase == \"to_from\" || phase == \"loading\")"
            action: "state = \"idle\", busy_task = 0, phase = \"none\", cancel_seq = cancel_seq + 1, moving = false, stopped = false, route = 0, avoid = 0, req_open = false, waiting = false, dest_x = home_x, dest_y = home_y, move_req = move_req + 1"
          - condtype: 1
            condition: "state == \"busy\" && busy_task == 1 && t1_lead != agentId && t1_lead != 0 && (phase == \"to_from\" || phase == \"loading\") && ext.is_robot"
            action: "ext.wake = ext.wake + 1"

      # Termination of the task's process: deactivate slot 1 everywhere,
      # dispatcher included (it then knows the slot is free).
      - name: "Terminate1"
        event: "finished"
        tasks:
          - condtype: 0
            condition: "finished == 1"
            action: "t1_active = false, finished = 0"
          - condtype: 1
            condition: "finished == 1 && ext.t1_active"
            action: "ext.t1_active = false"

  # ===========================================================================
  # Dispatcher: a new task (new_fx..new_ty, pending = true, written from
  # outside) goes into the first free slot and is announced to all robots.
  # One task is buffered; if all slots are busy it waits for a Terminate.
  # ===========================================================================
  - id: dispatch
    rules:
      - name: "Dispatch1"
        event: "pending t1_active"
        tasks:
          - condtype: 0
            condition: "pending && !t1_active"
            action: "t1_active = true, pending = false"
          - condtype: 1
            condition: "pending && !t1_active && ext.is_robot"
            action: "ext.t1_active = true, ext.t1_fx = new_fx, ext.t1_fy = new_fy, ext.t1_tx = new_tx, ext.t1_ty = new_ty, ext.t1_bid = 0, ext.t1_bround = 0, ext.t1_lead = 0, ext.t1_streak = 0"

      - name: "Dispatch2"
        event: "pending t1_active t2_active"
        tasks:
          - condtype: 0
            condition: "pending && t1_active && !t2_active"
            action: "t2_active = true, pending = false"
          - condtype: 1
            condition: "pending && t1_active && !t2_active && ext.is_robot"
            action: "ext.t2_active = true, ext.t2_fx = new_fx, ext.t2_fy = new_fy, ext.t2_tx = new_tx, ext.t2_ty = new_ty, ext.t2_bid = 0, ext.t2_bround = 0, ext.t2_lead = 0, ext.t2_streak = 0"

      - name: "Dispatch3"
        event: "pending t1_active t2_active t3_active"
        tasks:
          - condtype: 0
            condition: "pending && t1_active && t2_active && !t3_active"
            action: "t3_active = true, pending = false"
          - condtype: 1
            condition: "pending && t1_active && t2_active && !t3_active && ext.is_robot"
